<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Mes images</title>
<style>
:root{--paper:#f8f5ef;--ink:#1b1917;--soft:#6b6459;--rule:#ded7ca;--accent:#7c2f27}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:48px 20px 120px}
header{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:28px}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)}
h1{font-size:clamp(26px,4vw,36px);font-weight:400;margin:.35em 0 .3em;line-height:1.12}
.lede{color:var(--soft);max-width:64ch;margin:0;font-size:15.5px}
section{margin:0 0 34px;padding-top:16px;border-top:1px solid var(--rule)}
.num{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
h2{font-size:clamp(18px,2.4vw,22px);font-weight:400;margin:.15em 0 .8em}
.tag{margin:0 0 22px}
.tag h3{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.tag h3 .st{font-size:12.5px;color:var(--accent);font-weight:400}
.drop{display:block;border:1px dashed var(--rule);background:#fff;border-radius:2px;padding:14px;text-align:center;color:var(--soft);font-size:14px;cursor:pointer}
.drop.hot{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
@media(max-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.cell{position:relative;border:2px solid transparent;background:#fff;border-radius:2px;overflow:hidden;cursor:pointer}
.cell img{display:block;width:100%;height:110px;object-fit:cover;background:#eae4d8}
.cell.sel{border-color:var(--accent)}
.cell .del{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:9px;background:rgba(27,25,23,.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.summary{position:fixed;left:0;right:0;bottom:0;background:rgba(248,245,239,.97);border-top:1px solid var(--rule)}
.in{max-width:980px;margin:0 auto;padding:11px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.count{color:var(--soft)}.count b{color:var(--ink)}
button.act{font-family:inherit;font-size:14px;padding:9px 15px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:2px;cursor:pointer}
button.act.ghost{background:transparent;color:var(--ink)}
pre{display:none;white-space:pre-wrap;font-size:13px;background:#fff;border:1px solid var(--rule);padding:12px;margin-top:10px;max-height:220px;overflow:auto;font-family:ui-monospace,Menlo,monospace}
</style></head><body><div class="wrap">
<header><div class="kicker">Scribing — appareil iconographique</div>
<h1>Mes propres images</h1>
<p class="lede">Pour chaque mot, déposez autant d'images que vous voulez, puis touchez celle que vous gardez.
Tout reste dans ce navigateur ; rien n'est envoyé. Le bouton du bas compose la liste de vos choix.</p></header>
<div id="app"></div>
<div class="summary"><div class="in">
<span class="count"><b id="n">0</b> mot(s) décidé(s)</span>
<span style="display:flex;gap:9px"><button class="act ghost" id="reset">Tout effacer</button><button class="act" id="copy">Copier la liste</button></span>
</div><pre id="out"></pre></div></div>
<script id="donnees" type="application/json">[{"n": "I", "t": "Introduction", "items": [{"tag": "Gog et Magog"}, {"tag": "le Cerastes Cornutus"}, {"tag": "Cernunnos"}, {"tag": "Pángǔ"}, {"tag": "Madhu et Kaitabha"}, {"tag": "l'Amphisbène"}]}, {"n": "II", "t": "Pacte avec le diable", "items": [{"tag": "l'Équerre et le Compas"}, {"tag": "ad-Dajjal"}, {"tag": "l'Œil du Cœur"}, {"tag": "le « dispositif »"}, {"tag": "le domaine numérique"}, {"tag": "l'encodage et le décodage"}]}, {"n": "III", "t": "La réalisation à rebours", "items": [{"tag": "l'Athanor"}, {"tag": "les archétypes subconscients"}, {"tag": "les empreintes de mains"}]}, {"n": "IV", "t": "L'organisation sociale contre-traditionnelle", "items": [{"tag": "la manne du désert"}, {"tag": "le Royaume de l'Antéchrist"}]}, {"n": "VI", "t": "Igne natura renovatur integra", "items": [{"tag": "les Ashvins"}, {"tag": "Sayyidina Ilyâs"}, {"tag": "al-Khidr"}, {"tag": "Panchajanya"}, {"tag": "les Quatre Kumaras"}, {"tag": "l'Arche"}, {"tag": "le Yoni"}, {"tag": "le Hamsa"}]}, {"n": "VII", "t": "La fin d'une illusion", "items": [{"tag": "la lettre mîm"}, {"tag": "la Makâra"}, {"tag": "le Capricorne"}, {"tag": "Hiranyagarbha"}, {"tag": "la Théorie du Geste"}]}]</script>
<script>
const D=JSON.parse(document.getElementById("donnees").textContent);
const SKEY="scribing-own-sel-v1";
let SEL=JSON.parse(localStorage.getItem(SKEY)||"{}");
const app=document.getElementById("app");
const dbp=()=>new Promise((res,rej)=>{const r=indexedDB.open("scribing",1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("img"))r.result.createObjectStore("img");};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});
async function put(k,v){const db=await dbp();return new Promise((res,rej)=>{const t=db.transaction("img","readwrite");t.objectStore("img").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function del(k){const db=await dbp();return new Promise((res,rej)=>{const t=db.transaction("img","readwrite");t.objectStore("img").delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function tout(){const db=await dbp();return new Promise((res,rej)=>{const t=db.transaction("img","readonly");const rq=t.objectStore("img").getAll();const kq=t.objectStore("img").getAllKeys();
  t.oncomplete=()=>{const out={};rq.result.forEach((v,i)=>{out[kq.result[i]]=v;});res(out);};t.onerror=()=>rej(t.error);});}
let FILES={};
D.forEach(sec=>{
  const el=document.createElement("section");
  el.innerHTML='<div class="num">Section '+sec.n+'</div><h2>'+sec.t+'</h2>';
  sec.items.forEach(it=>{
    const key=sec.n+"|"+it.tag;
    const box=document.createElement("div"); box.className="tag"; box.dataset.key=key;
    box.innerHTML='<h3>'+it.tag+'<span class="st"></span></h3>'+
      '<label class="drop">Déposez des images ici, ou touchez pour choisir'+
      '<input type="file" accept="image/*" multiple hidden></label><div class="grid"></div>';
    el.appendChild(box);
  });
  app.appendChild(el);
});
function render(key){
  const box=document.querySelector('.tag[data-key="'+CSS.escape(key)+'"]');
  if(!box) return;
  const grid=box.querySelector(".grid"); grid.innerHTML="";
  const list=Object.entries(FILES).filter(([k])=>k.startsWith(key+"#")).sort();
  list.forEach(([k,v])=>{
    const cell=document.createElement("div"); cell.className="cell"+(SEL[key]===k?" sel":"");
    const img=document.createElement("img"); img.src=URL.createObjectURL(v.b); img.loading="lazy";
    const delbtn=document.createElement("a"); delbtn.className="del"; delbtn.textContent="×"; delbtn.href="#";
    delbtn.onclick=async e=>{e.preventDefault();e.stopPropagation();
      await del(k); delete FILES[k]; if(SEL[key]===k){delete SEL[key];localStorage.setItem(SKEY,JSON.stringify(SEL));}
      render(key); count();};
    cell.appendChild(img); cell.appendChild(delbtn);
    cell.onclick=()=>{SEL[key]=k; localStorage.setItem(SKEY,JSON.stringify(SEL)); render(key); count();};
    grid.appendChild(cell);
  });
  const st=box.querySelector(".st"); st.textContent = SEL[key] ? "retenue" : (list.length? list.length+" image(s)" : "");
}
function count(){
  let n=0; D.forEach(s=>s.items.forEach(i=>{ if(SEL[s.n+"|"+i.tag]) n++; }));
  document.getElementById("n").textContent=n;
}
document.addEventListener("change",async e=>{
  const inp=e.target.closest(".tag")?.querySelector("input[type=file]");
  if(!inp || e.target!==inp) return;
  const key=inp.closest(".tag").dataset.key;
  for(const f of inp.files){
    const k=key+"#"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
    await put(k,{b:f,n:f.name});
    FILES[k]={b:f,n:f.name};
  }
  inp.value=""; render(key); count();
});
document.addEventListener("dragover",e=>{const d=e.target.closest(".drop"); if(d){e.preventDefault(); d.classList.add("hot");}});
document.addEventListener("dragleave",e=>{const d=e.target.closest(".drop"); if(d) d.classList.remove("hot");});
document.addEventListener("drop",async e=>{
  const d=e.target.closest(".drop"); if(!d) return; e.preventDefault(); d.classList.remove("hot");
  const key=d.closest(".tag").dataset.key;
  for(const f of e.dataTransfer.files){
    if(!f.type.startsWith("image/")) continue;
    const k=key+"#"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
    await put(k,{b:f,n:f.name}); FILES[k]={b:f,n:f.name};
  }
  render(key); count();
});
document.getElementById("reset").onclick=async()=>{
  if(!confirm("Effacer toutes les images et tous les choix ?")) return;
  const db=await dbp(); await new Promise(r=>{const t=db.transaction("img","readwrite");t.objectStore("img").clear();t.oncomplete=r;});
  FILES={}; SEL={}; localStorage.setItem(SKEY,"{}");
  document.querySelectorAll(".tag").forEach(b=>render(b.dataset.key)); count();
  document.getElementById("out").style.display="none";
};
document.getElementById("copy").onclick=async()=>{
  let out="";
  D.forEach(s=>{const l=[];s.items.forEach(i=>{const k=s.n+"|"+i.tag;const v=SEL[k];
    if(v&&FILES[v]) l.push(i.tag+" → "+FILES[v].n);});
    if(l.length) out+=s.n+" — "+s.t+" : "+l.join(" · ")+"\n";});
  const pre=document.getElementById("out");
  pre.textContent=out||"Aucun choix encore enregistré."; pre.style.display="block";
  try{await navigator.clipboard.writeText(pre.textContent);document.getElementById("copy").textContent="Copié";}
  catch(err){document.getElementById("copy").textContent="Sélectionnez le texte";}
  setTimeout(()=>{document.getElementById("copy").textContent="Copier la liste";},1800);
};
(async()=>{
  try{ FILES=await tout(); }catch(e){ FILES={}; }
  document.querySelectorAll(".tag").forEach(b=>render(b.dataset.key));
  count();
})();
</script></body></html>
